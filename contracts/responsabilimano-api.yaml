openapi: 3.1.0
info:
  title: ResponsabiliMano API
  version: 0.1.0
  description: >
    Brownfield baseline (spec R9) of the existing minimal-API endpoints served by
    ResponsabiliMano.Web. Enums are serialized as integers (System.Text.Json
    default); the mapping is documented per schema. This contract is the baseline
    for contract testing (Tenet 6) — evolve it before changing an endpoint.

servers:
  - url: /
    description: Same-origin (Blazor Server host)

tags:
  - name: Auth
    description: Authentication and account recovery (/api/auth)
  - name: Projects
    description: Project lifecycle and change requests (/api/projects)
  - name: CheckIns
    description: >
      Check-in capture and scheduler-driven notifications (Sprint 3, specs
      S3.2–S3.4). These routes are gated behind the CheckIns feature flag and
      respond 404 while the flag is off (spec R7).
  - name: Dashboard
    description: >
      Aggregated dashboard data, per project (Sprint 4, spec S4.1) and account-wide
      (spec S6.1). Gated behind the Dashboard feature flag; responds 404 while the
      flag is off (spec R7).
  - name: Cron
    description: Scheduler-only jobs (/api/cron), authenticated by a shared secret header.

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/register-and-login:
    post:
      tags: [Auth]
      summary: Register a new user and sign them in with a cookie
      operationId: registerAndLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '302':
          description: >
            Redirect to '/' on success (auth cookie set) or to
            '/register?error=Validation'/'/register?error=Conflict' on failure.
          headers:
            Location:
              schema: { type: string }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive the auth cookie (form post; antiforgery disabled)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '302':
          description: >
            Redirect to '/' on success (Set-Cookie: ResponsabiliMano.Auth) or to
            '/login?error=InvalidCredentials' on failure.
          headers:
            Location:
              schema: { type: string }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (antiforgery disabled)
      operationId: logout
      security: []
      responses:
        '302':
          description: Redirect to '/login'
          headers:
            Location:
              schema: { type: string }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset link (antiforgery disabled)
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Always OK — does not reveal whether the email exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password using a valid token (antiforgery disabled)
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Validation error or invalid/expired token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/projects:
    post:
      tags: [Projects]
      summary: Create a project (antiforgery disabled)
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCreated' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Get a project the caller participates in
      operationId: getProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Project not found or not visible to the caller }

  /api/projects/{id}/invite:
    post:
      tags: [Projects]
      summary: Invite a partner to the project (antiforgery disabled)
      operationId: invitePartner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitePartnerRequest' }
      responses:
        '200':
          description: Invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSummary' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/approve:
    post:
      tags: [Projects]
      summary: Accept all pending goal targets for the caller (antiforgery disabled)
      operationId: approveProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Pending goal targets accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/goal-negotiation:
    get:
      tags: [Projects]
      summary: Get the goal negotiation state for the project
      operationId: getGoalNegotiation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Negotiation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalNegotiationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/goal-targets/{targetId}/accept:
    post:
      tags: [Projects]
      summary: Accept a goal target (antiforgery disabled)
      operationId: acceptGoalTarget
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: targetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal target accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/goal-targets/{targetId}/proposals:
    post:
      tags: [Projects]
      summary: Propose a new value for a goal target (antiforgery disabled)
      operationId: proposeGoalTarget
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: targetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalProposalRequest' }
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalProposalCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/change-requests:
    post:
      tags: [Projects]
      summary: Propose a change to the project (antiforgery disabled)
      operationId: proposeChange
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeChangeRequest' }
      responses:
        '201':
          description: Change request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/change-requests/{crId}/respond:
    post:
      tags: [Projects]
      summary: Approve or reject a change request (antiforgery disabled)
      operationId: respondToChangeRequest
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: crId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: approve
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200':
          description: Change request resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/checkins:
    post:
      tags: [CheckIns]
      summary: >
        Submit the caller's check-in for the current period (antiforgery disabled).
        Behind the CheckIns feature flag: 404 while off.
      operationId: submitCheckIn
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCheckInRequest' }
      responses:
        '201':
          description: Check-in recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Project not found, or the CheckIns feature is disabled' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/checkins/current:
    put:
      tags: [CheckIns]
      summary: >
        Update the caller's check-in for the current period (antiforgery disabled).
        Behind the CheckIns feature flag: 404 while off.
      operationId: updateCurrentCheckIn
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCheckInRequest' }
      responses:
        '200':
          description: Check-in updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Project not found, or the CheckIns feature is disabled' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [CheckIns]
      summary: >
        Delete the caller's check-in for the current period (antiforgery disabled).
        Behind the CheckIns feature flag: 404 while off.
      operationId: deleteCurrentCheckIn
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Check-in deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Project not found, or the CheckIns feature is disabled' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/dashboard:
    get:
      tags: [Dashboard]
      summary: >
        Get aggregated dashboard data for a project (spec S4.1). Behind the
        Dashboard feature flag: 404 while off.
      operationId: getProjectDashboard
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Project not found, or the Dashboard feature is disabled' }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: >
        Get the caller's account-wide panel: consolidated counters plus one summary
        per project (spec S6.1). Behind the Dashboard feature flag: 404 while off.
      operationId: getGlobalDashboard
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Consolidated data for every project the caller participates in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'The Dashboard feature is disabled' }

  /api/cron/checkins/dispatch:
    post:
      tags: [Cron]
      summary: >
        Send the period's check-in emails to participants of eligible projects
        (spec S3.3). Scheduler-only; idempotent within a period.
      operationId: dispatchCheckInEmails
      security:
        - cronSecret: []
      responses:
        '200':
          description: Number of emails sent on this run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronDispatchResult' }
        '401': { description: Missing or invalid X-Cron-Secret header }
        '404': { description: The CheckIns feature is disabled }

  /api/cron/checkins/reminders:
    post:
      tags: [Cron]
      summary: >
        Send reminders to participants who have not checked in this period
        (spec S3.4). Scheduler-only; idempotent within a period.
      operationId: dispatchCheckInReminders
      security:
        - cronSecret: []
      responses:
        '200':
          description: Number of reminders sent on this run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronDispatchResult' }
        '401': { description: Missing or invalid X-Cron-Secret header }
        '404': { description: The CheckIns feature is disabled }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ResponsabiliMano.Auth
      description: Cookie authentication issued by /api/auth/login.
    cronSecret:
      type: apiKey
      in: header
      name: X-Cron-Secret
      description: Shared secret for scheduler-only cron endpoints (see ADR-0005).

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationProblem:
      description: RFC 7807 validation problem (field -> messages)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Caller is not authenticated
    Forbidden:
      description: Caller may not act on this resource
    Conflict:
      description: Domain rule violated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ProjectFrequency:
      type: integer
      description: '0=Daily, 1=Weekly, 2=Biweekly, 3=Monthly'
      enum: [0, 1, 2, 3]
    GoalDataType:
      type: integer
      description: '0=Decimal, 1=Integer, 2=Percent'
      enum: [0, 1, 2]
    GoalDirection:
      type: integer
      description: '0=Decrease, 1=Increase, 2=Reach, 3=Maintain'
      enum: [0, 1, 2, 3]
    ChangeRequestType:
      type: integer
      description: '0=EndDate, 1=Frequency, 2=Goals'
      enum: [0, 1, 2]
    ProjectStatus:
      type: integer
      description: '0=Pending, 1=Active, 2=Finished, 3=Cancelled'
      enum: [0, 1, 2, 3]
    ChangeRequestStatus:
      type: integer
      description: '0=Pending, 1=Approved, 2=Rejected'
      enum: [0, 1, 2]
    GoalTargetStatus:
      type: integer
      description: '0=Draft, 1=PendingAcceptance, 2=Accepted'
      enum: [0, 1, 2]
    GoalProposalStatus:
      type: integer
      description: '0=Pending, 1=Accepted, 2=Rejected, 3=Superseded'
      enum: [0, 1, 2, 3]
    Feeling:
      type: integer
      description: '1=VerySad, 2=Sad, 3=Neutral, 4=Happy, 5=VeryHappy'
      enum: [1, 2, 3, 4, 5]

    RegisterRequest:
      type: object
      required: [name, email, password, confirmPassword]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        confirmPassword: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
        confirmPassword: { type: string, minLength: 8 }
    GoalFieldRequest:
      type: object
      required: [label, dataType, unit]
      properties:
        label: { type: string, maxLength: 200 }
        dataType: { $ref: '#/components/schemas/GoalDataType' }
        unit: { type: string, maxLength: 50 }
        minValue: { type: [number, 'null'] }
        maxValue: { type: [number, 'null'] }
    GoalTargetRequest:
      type: object
      required: [direction]
      properties:
        baseline: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        direction: { $ref: '#/components/schemas/GoalDirection' }
    GoalProposalRequest:
      type: object
      required: [direction]
      properties:
        baseline: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        direction: { $ref: '#/components/schemas/GoalDirection' }
        comment: { type: [string, 'null'], maxLength: 500 }
    GoalProposalCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/GoalProposalStatus' }
    GoalNegotiationResponse:
      type: object
      properties:
        acceptedCount: { type: integer }
        totalCount: { type: integer }
        creatorId: { type: string, format: uuid }
        partnerId: { type: [string, 'null'], format: uuid }
        goals:
          type: array
          items: { $ref: '#/components/schemas/GoalNegotiationGoal' }
    GoalNegotiationGoal:
      type: object
      properties:
        goalFieldId: { type: string, format: uuid }
        label: { type: string }
        dataType: { $ref: '#/components/schemas/GoalDataType' }
        unit: { type: string }
        minValue: { type: [number, 'null'] }
        maxValue: { type: [number, 'null'] }
        creatorTarget: { $ref: '#/components/schemas/GoalNegotiationTarget' }
        partnerTarget: { $ref: '#/components/schemas/GoalNegotiationTarget' }
    GoalNegotiationTarget:
      type: object
      properties:
        goalTargetId: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        baseline: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        direction: { $ref: '#/components/schemas/GoalDirection' }
        status: { $ref: '#/components/schemas/GoalTargetStatus' }
        acceptedByCreator: { type: boolean }
        acceptedByPartner: { type: boolean }
        lastProposedByUserId: { type: [string, 'null'], format: uuid }
        lastProposedAt: { type: [string, 'null'], format: date-time }
        lastProposerName: { type: [string, 'null'] }
        lastComment: { type: [string, 'null'] }
    CreateProjectGoalFieldRequest:
      type: object
      required: [goal, creatorTarget]
      properties:
        goal: { $ref: '#/components/schemas/GoalFieldRequest' }
        creatorTarget: { $ref: '#/components/schemas/GoalTargetRequest' }
        suggestedPartnerTarget:
          oneOf:
            - $ref: '#/components/schemas/GoalTargetRequest'
            - type: 'null'
    CreateProjectRequest:
      type: object
      required: [name, startDate, endDate, frequency, goals]
      properties:
        name: { type: string, maxLength: 200 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        frequency: { $ref: '#/components/schemas/ProjectFrequency' }
        goals:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateProjectGoalFieldRequest' }
    InvitePartnerRequest:
      type: object
      required: [partnerEmail]
      properties:
        partnerEmail: { type: string, format: email, maxLength: 256 }
    ProposeChangeRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/ChangeRequestType' }
        newEndDate: { type: [string, 'null'], format: date-time }
        newFrequency:
          oneOf:
            - $ref: '#/components/schemas/ProjectFrequency'
            - type: 'null'
        goals:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/GoalFieldRequest' }

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    ProjectCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
    InvitationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
    ChangeRequestCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ChangeRequestStatus' }
    ProjectDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        frequency: { $ref: '#/components/schemas/ProjectFrequency' }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        creatorName: { type: string }
        partnerName: { type: [string, 'null'] }
        goals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              dataType: { $ref: '#/components/schemas/GoalDataType' }
              unit: { type: string }
              minValue: { type: [number, 'null'] }
              maxValue: { type: [number, 'null'] }
              targets:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      oneOf:
                        - { type: string, format: uuid }
                        - type: 'null'
                    baseline: { type: [number, 'null'] }
                    targetValue: { type: [number, 'null'] }
                    direction: { $ref: '#/components/schemas/GoalDirection' }
                    status: { $ref: '#/components/schemas/GoalTargetStatus' }
                    acceptedByCreator: { type: boolean }
                    acceptedByPartner: { type: boolean }
                    lastProposedByUserId:
                      oneOf:
                        - { type: string, format: uuid }
                        - type: 'null'
                    lastProposedAt: { type: [string, 'null'], format: date-time }
        changeRequests:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type: { $ref: '#/components/schemas/ChangeRequestType' }
              status: { $ref: '#/components/schemas/ChangeRequestStatus' }
              createdAt: { type: string, format: date-time }
              requestedByUserId: { type: string, format: uuid }

    SubmitCheckInRequest:
      type: object
      required: [feeling, metrics]
      properties:
        feeling: { $ref: '#/components/schemas/Feeling' }
        metrics:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CheckInMetricValue' }
    CheckInMetricValue:
      type: object
      required: [goalFieldId, value]
      properties:
        goalFieldId: { type: string, format: uuid }
        value: { type: number }
    CheckInCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        periodNumber: { type: integer }
        feeling: { $ref: '#/components/schemas/Feeling' }
        updatedAt:
          type: [string, 'null']
          format: date-time
    CronDispatchResult:
      type: object
      properties:
        sent: { type: integer, description: Number of messages sent on this run }

    DashboardResponse:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        participants:
          type: array
          items: { $ref: '#/components/schemas/DashboardParticipant' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/DashboardMetricSeries' }
    DashboardParticipant:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        latestFeeling:
          oneOf:
            - $ref: '#/components/schemas/Feeling'
            - type: 'null'
    DashboardMetricSeries:
      type: object
      properties:
        goalFieldId: { type: string, format: uuid }
        label: { type: string }
        unit: { type: string }
        dataType: { $ref: '#/components/schemas/GoalDataType' }
        targets:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              baseline: { type: [number, 'null'] }
              targetValue: { type: [number, 'null'] }
              direction: { $ref: '#/components/schemas/GoalDirection' }
        series:
          type: array
          items: { $ref: '#/components/schemas/DashboardSeriesEntry' }
    DashboardSeriesEntry:
      type: object
      properties:
        userId: { type: string, format: uuid }
        periodNumber: { type: integer }
        submittedAt: { type: string, format: date-time }
        value: { type: number }
        averageValue: { type: [number, 'null'] }

    GlobalDashboardResponse:
      type: object
      properties:
        totalProjects: { type: integer }
        activeProjects: { type: integer }
        totalCheckIns:
          type: integer
          description: Check-ins the caller submitted across every project
        currentStreak:
          type: integer
          description: Caller's best current streak among their projects (not a sum)
        bestStreak: { type: integer }
        openCheckIns:
          type: integer
          description: Active projects whose current period the caller has not filled in
        projects:
          type: array
          items: { $ref: '#/components/schemas/GlobalProjectSummary' }
    GlobalProjectSummary:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        frequency: { $ref: '#/components/schemas/ProjectFrequency' }
        creatorName: { type: string }
        partnerName: { type: [string, 'null'] }
        currentPeriod:
          type: integer
          description: 1-based current period, or 0 when the project has not started
        totalPeriods: { type: integer }
        checkInsSubmitted: { type: integer }
        checkInPending: { type: boolean }
        latestFeeling:
          oneOf:
            - $ref: '#/components/schemas/Feeling'
            - type: 'null'
        goalCount: { type: integer }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    ValidationProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

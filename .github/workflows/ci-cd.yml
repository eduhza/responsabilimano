name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (+ coverage)
        run: >
          dotnet test --no-build --configuration Release
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # Quality gate: fail the build if line coverage drops below the minimum.
      # Tune 'thresholds' (min recommended) as coverage grows. See rule quality-gates.md.
      - name: Coverage gate
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: false
          fail_below_min: true
          format: markdown
          thresholds: '65 80'
          output: both

      # SCA: fail on known-vulnerable NuGet packages (direct or transitive).
      - name: Dependency vulnerability scan (SCA)
        run: |
          echo "Scanning for vulnerable NuGet packages..."
          report=$(dotnet list package --vulnerable --include-transitive 2>&1 || true)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable"; then
            echo "::error::Vulnerable packages detected — see log above."
            exit 1
          fi
          echo "No vulnerable packages found."

  # SAST: static analysis of the C# code. Never skipped (Tenet 5).
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build
        run: dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # AI-Native gate (spec R9): lint the OpenAPI baseline and verify the mapped
  # routes still match the documented contract (conformance).
  spec-and-contract-gate:
    name: Spec Conformance & Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint contracts/responsabilimano-api.yaml

      - name: Contract conformance (routes match contract)
        run: python scripts/contract-conformance.py

  # NOTA: o deploy para Cloud Run NAO acontece mais aqui. Ele foi movido para o
  # Google Cloud Build (`cloudbuild.yaml`, trigger em push para main) para que a
  # publicacao em producao nao dependa da disponibilidade do GitHub Actions.
  # Ver docs/deploy-manual.md.
